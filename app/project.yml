name: DevCleaner
options:
  bundleIdPrefix: com.canakyuz
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    PRODUCT_BUNDLE_IDENTIFIER: com.canakyuz.devcleaner
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: false
    INFOPLIST_FILE: Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Resources/DevCleaner.entitlements
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  DevCleaner:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Resources/Assets.xcassets
        type: file
        buildPhase: resources
    resources:
      - path: Resources/Info.plist
        buildPhase: none
      - path: Resources/DevCleaner.entitlements
        buildPhase: none
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
